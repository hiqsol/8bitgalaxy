# Managed by devkit (github.com/hiqdev/devkit): `uvx copier update --trust` merges template changes
# into it, keeping the project's own lines.
# Vale prose lint over the pages uwiki reads; vale sync fetches Packages into .vale/styles.
# Big style guides (Google, Microsoft, write-good) argue taste: semicolons, passive voice; these stay quiet unless wrong.
StylesPath = .vale/styles
MinAlertLevel = warning
Packages = proselint
# words of this project: accept.txt makes Vale.Terms enforce their case, reject.txt makes Vale.Avoid flag them
Vocab = Wiki

[*.md]
# phrases prose rules misread: "in a word character" is no cliche; "for free" is a rules term
TokenIgnores = (word\s+characters?|[Ff]or\s+free)
BasedOnStyles = Vale, proselint
# typos owns spelling; Vale.Spelling flags every word not in its dictionary or the vocabulary
Vale.Spelling = NO
# `...` between code spans means "and the lines between", not an ellipsis
proselint.Typography = NO
# a paragraph starting with But is style, not a mistake
proselint.But = NO

# game logs: `A a C2m` is player A and a card, no repeated word
[games/*.md]
Vale.Repetition = NO

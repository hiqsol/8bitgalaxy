# uwiki defaults: top level ones for every command taking them, make link and check alike
exclude = ["build"]
# a page's own terms are bold, not linked
mentions-self-bold = true
# names that contain terms: game titles, ranks in lore
mentions-ignore = ["Star Realms", "Twilight Imperium", "Star Wars", "Forbidden Stars", "A Handful of Stars",
    "Trade Deck", "Leader Noor Abadi", "Leader Abadi", "Leader Iver Castellan", "Leader Castellan"]
# architecture decisions name code and UI, not rule terms
mentions-exclude = ["adr/*"]

[check]
orphans = true
# warn about every plain mention of a page name or alias, make link links them
mentions = true
mentions-every = true

# status, scope and tags values are documented in meta/Docs.md and rules/index.md,
# bin/checkdocs keeps them the same
[schema]
_required = ["scope", "status"]
scope = ["core", "duel", "advanced", "events", "objectives", "politics", "meta", "playtest", "idea", "lore"]
status = ["stub", "draft", "issues", "polish", "stable", "living"]
aliases = "list"
tags = ["tech/action", "tech/modifier", "tech/hub",
    "class/military", "class/culture", "class/production", "class/science",
    "on/ship", "on/hero", "on/base", "on/colony", "on/hyperstructure", "on/tool",
    "planned", "galaxy",
    "topic/combat", "topic/hidden", "topic/movement", "topic/deck", "topic/economy",
    "topic/build", "topic/damage", "topic/capture", "topic/hero"]

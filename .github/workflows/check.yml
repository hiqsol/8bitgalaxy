# Managed by devkit (github.com/hiqdev/devkit): `mise run check`, lint and the project's tests, with the tools
# mise pins
name: check

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v5
      - run: mise run check

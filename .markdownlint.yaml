# 8bitgalaxy's markdownlint rules on top of devkit's
extends: .config/devkit/markdownlint.yaml
MD007: false                              # list indent: tabs nest lists
MD009: false                              # trailing spaces
MD010: false                              # hard tabs
MD013:                                    # lines wrap at 70, as uwiki wrap does
  line_length: 70
  tables: false
  code_blocks: false
MD030: false                              # spaces after list markers
MD031: false                              # blank lines around fences
MD040: false                              # fence language
